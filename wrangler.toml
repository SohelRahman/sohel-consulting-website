name = "consulting"
main = "src/worker.js"
compatibility_date = "2026-11-12"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "none"
run_worker_first = ["/api/*", "/admin", "/src/*", "/migrations/*"]

# Production database. Preview deployments must never use this database.
[[d1_databases]]
binding = "DB"
database_name = "consulting-db"
database_id = "3a4f765a-46c2-4040-9753-36e9483893a4"
migrations_dir = "migrations"

# Worker Previews use a separate D1 database and explicit preview settings.
# Preview secrets are configured outside this file in Cloudflare.
[previews.vars]
ENVIRONMENT = "preview"

[[previews.d1_databases]]
binding = "DB"
database_id = "e0317397-77cb-4f36-9d19-2594ff75b0c2"
migrations_dir = "migrations"

# Isolated object storage for Preview media uploads. Production has no MEDIA binding yet.
[[previews.r2_buckets]]
binding = "MEDIA"
bucket_name = "consulting-media-preview"
