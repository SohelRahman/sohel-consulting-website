name = "consulting"
main = "src/worker.js"
compatibility_date = "2026-11-12"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/admin", "/src/*", "/migrations/*"]

[[d1_databases]]
binding = "DB"
database_name = "consulting-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
