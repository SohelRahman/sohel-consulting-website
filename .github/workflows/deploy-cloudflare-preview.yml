name: Deploy Cloudflare Preview Worker

on:
  workflow_dispatch:
  push:
    branches:
      - current-focus-development

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-worker-deploy
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/current-focus-development' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-preview]'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Preview deployment credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_WORKERS_API_TOKEN GitHub Actions secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID GitHub Actions secret}"
          echo "Required deployment credentials are present; values are not displayed."

      - name: Verify isolated Preview Worker and D1 configuration
        env:
          # D1 identity lookup uses the same D1-read credential as the migration workflows.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = readFileSync("wrangler.preview.toml", "utf8");
          const lines = config.split("\n").map(line => line.trim());
          const productionId = "3a4f765a-46c2-4040-9753-36e9483893a4";
          const expectedPreviewId = "e0317397-77cb-4f36-9d19-2594ff75b0c2";
          if (!lines.includes('name = "current-focus-development"')) throw new Error("Unexpected Worker name; refusing deployment.");
          if (!lines.includes('database_name = "consulting-preview-db"') ||
              !lines.includes(`database_id = "${expectedPreviewId}"`) ||
              expectedPreviewId === productionId) throw new Error("Preview D1 target mismatch; refusing deployment.");
          if (!lines.includes('ENVIRONMENT = "preview"')) throw new Error("Preview environment marker is missing; refusing deployment.");
          if (!lines.includes('main = "src/worker.js"')) throw new Error("Unexpected Worker entry point.");

          const token = (process.env.CLOUDFLARE_API_TOKEN || "").replaceAll(" ", "").replaceAll("\n", "").replaceAll("\r", "").replaceAll("\t", "");
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const verify = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
            headers: { Authorization: `Bearer ${token}` }
          });
          const verification = await verify.json().catch(() => ({}));
          if (!verify.ok || verification.success !== true || verification.result?.status !== "active") {
            throw new Error("Cloudflare API token is not confirmed active; refusing deployment.");
          }
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${expectedPreviewId}`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const payload = await response.json().catch(() => ({}));
          const actualId = payload.result?.uuid ?? payload.result?.id ?? payload.result?.database_id ?? null;
          if (!response.ok || payload.success !== true ||
              payload.result?.name !== "consulting-preview-db" ||
              actualId !== expectedPreviewId) {
            const apiErrors = Array.isArray(payload.errors)
              ? payload.errors.map(error => ({ code: error.code, message: error.message }))
              : [];
            console.error(JSON.stringify({
              httpStatus: response.status,
              apiSuccess: payload.success === true,
              apiErrors,
              returnedName: payload.result?.name ?? null,
              returnedId: actualId,
              resultKeys: payload.result && typeof payload.result === "object" ? Object.keys(payload.result).sort() : []
            }));
            throw new Error("Cloudflare API did not confirm the exact Preview D1 database; refusing deployment. Review the sanitized response details above.");
          }
          console.log("Verified active Cloudflare token and exact Preview D1 database. No secrets were printed.");
          NODE

      - name: Run source validation
        run: |
          set -euo pipefail
          node --input-type=module --check < src/worker.js
          node --check assets/site.js
          node scripts/validate-site.mjs
          node scripts/test-rbac-contract.mjs
          node scripts/test-password-hash.mjs
          node scripts/test-course-pricing.mjs
          node scripts/test-registration-workflow.mjs
          node scripts/test-quotation-response.mjs

      - name: Check CMS revision and Admin MFA contracts before deployment
        run: |
          set -euo pipefail
          node scripts/test-cms-revision-contract.mjs
          python3 scripts/test-cms-revision-sqlite.py
          node scripts/test-admin-mfa.mjs

      - name: Bootstrap Preview Worker before setting Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 deploy --config wrangler.preview.toml

      - name: Ensure Preview MFA encryption key exists without rotating an existing key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.160.1 secret list --name current-focus-development --config wrangler.preview.toml > /tmp/preview-worker-secrets.json
          if ! node --input-type=module -e 'import fs from "node:fs"; const x=JSON.parse(fs.readFileSync("/tmp/preview-worker-secrets.json","utf8")); const rows=Array.isArray(x)?x:(x.result||[]); process.exit(rows.some(v=>v.name==="MFA_ENCRYPTION_KEY")?0:1);'; then
            KEY="$(node --input-type=module -e 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("base64url"));')"
            printf '%s' "$KEY" | npx --yes wrangler@4.160.1 secret put MFA_ENCRYPTION_KEY --name current-focus-development --config wrangler.preview.toml
            unset KEY
            echo "A new Preview-only MFA encryption key was generated and stored; its value was not displayed."
          else
            echo "An MFA encryption key already exists; it was not rotated."
          fi

      - name: Deploy Preview Worker and static assets only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 deploy --config wrangler.preview.toml
