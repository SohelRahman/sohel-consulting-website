name: Isolated Argon2id Cloudflare Preview runtime test

on:
  workflow_dispatch:
  push:
    branches:
      - current-focus-development
    paths:
      - 'prototypes/argon2id-wasm/Cargo.toml'
      - 'prototypes/argon2id-wasm/Cargo.lock'
      - 'prototypes/argon2id-wasm/src/**'
      - 'prototypes/argon2id-wasm/test/**'
      - 'prototypes/argon2id-wasm/worker.mjs'
      - 'prototypes/argon2id-wasm/worker-adapter.mjs'
      - 'prototypes/argon2id-wasm/wrangler.toml'
      - '.github/workflows/test-argon2id-cloudflare-preview.yml'

permissions:
  contents: read

concurrency:
  group: argon2id-cloudflare-preview-runtime
  cancel-in-progress: false

jobs:
  runtime:
    if: github.ref == 'refs/heads/current-focus-development' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[argon2-preview]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: current-focus-development
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build precompiled WASM and Worker bindings
        working-directory: prototypes/argon2id-wasm
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target wasm32-unknown-unknown
          echo "rustc=$(rustc --version)"
          echo "cargo=$(cargo --version)"
          echo "node=$(node --version)"
          echo "wrangler=4.160.1"
          VERSION="$(cargo tree --locked --target wasm32-unknown-unknown -i wasm-bindgen --prefix none | awk 'NR == 1 { sub(/^v/, "", $2); print $2 }')"
          : "${VERSION:?Could not resolve wasm-bindgen version}"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
          wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/sohel_argon2id_prototype.wasm
          test -s pkg/sohel_argon2id_prototype_bg.wasm
      - name: Deploy isolated Worker, verify runtime and remove it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The dedicated marker commit intentionally exits after runtime checks to exercise EXIT cleanup.
          ARGON2ID_INJECT_FAILURE_AFTER_RUNTIME: ${{ contains(github.event.head_commit.message, '[argon2-cleanup-failure-test]') && '1' || '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing Cloudflare Workers API token}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing Cloudflare account ID}"
          WORKER="sohel-argon2id-preview-${GITHUB_RUN_ID}"
          RUNTIME_START_MS="$(date +%s%3N)"
          CONFIG='prototypes/argon2id-wasm/wrangler.toml'
          TOKEN="$(node --input-type=module -e 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("base64url"))')"
          delete_worker_api() {
            local name="$1" label="$2" code
            code="$(curl --silent --show-error --output /tmp/argon2id-delete-response.json --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name")"
            case "$code" in
              200|204) echo "$label: deletion confirmed (HTTP $code)." ;;
              404) echo "$label: Worker was already absent (HTTP 404)." ;;
              *) echo "::error::$label deletion failed (HTTP $code)."; return 1 ;;
            esac
          }
          verify_worker_absent_api() {
            local name="$1" code
            code="$(curl --silent --show-error --output /tmp/argon2id-absence-response.json --write-out '%{http_code}' \
              --request GET \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name")"
            if [[ "$code" == '404' ]]; then
              echo "Temporary Worker absence verified (HTTP 404)."
            else
              echo "::error::Temporary Worker still exists or absence could not be verified (HTTP $code)."
              return 1
            fi
          }
          # Remove the exact orphaned test Worker from the preceding run before creating another.
          delete_worker_api 'sohel-argon2id-preview-45826985507' 'Previous temporary Worker'
          DEPLOY_ATTEMPTED=0
          CLEANUP_VERIFIED=0
          cleanup() {
            status=$?
            trap - EXIT
            if [[ "$DEPLOY_ATTEMPTED" == '1' ]]; then
              if delete_worker_api "$WORKER" 'Current temporary Worker' && verify_worker_absent_api "$WORKER"; then
                CLEANUP_VERIFIED=1
              else
                echo '::error::Temporary Worker cleanup could not be verified; manual cleanup is required.'
                status=1
              fi
            fi
            unset TOKEN
            if [[ "$ARGON2ID_INJECT_FAILURE_AFTER_RUNTIME" == '1' && "$status" == '73' && "$CLEANUP_VERIFIED" == '1' ]]; then
              echo 'Expected post-deployment failure was injected and cleanup was verified.'
              status=0
            fi
            exit "$status"
          }
          trap cleanup EXIT
          DEPLOY_ATTEMPTED=1
          npx --yes wrangler@4.160.1 deploy --name "$WORKER" --config "$CONFIG" 2>&1 | tee /tmp/argon2id-preview-deploy.log
          printf '%s' "$TOKEN" | npx --yes wrangler@4.160.1 secret put TEST_TOKEN --name "$WORKER" --config "$CONFIG"
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/argon2id-preview-deploy.log | tail -n 1)"
          : "${URL:?Could not identify isolated Preview Worker URL}"
          export ARGON2ID_TEST_URL="$URL" ARGON2ID_TEST_TOKEN="$TOKEN"
          node --input-type=module <<'NODE'
          const headers = { authorization: `Bearer ${process.env.ARGON2ID_TEST_TOKEN}` };
          const base = process.env.ARGON2ID_TEST_URL;
          let health;
          for (let attempt = 0; attempt < 10; attempt += 1) {
            health = await fetch(`${base}/health`, { headers });
            if (health.ok) break;
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!health?.ok) throw new Error(`Worker health check failed after propagation retries: HTTP ${health?.status ?? "no response"}`);
          const healthBody = await health.json();
          if (healthBody.runtime !== "cloudflare-workers" || healthBody.ok !== true) throw new Error("Unexpected Worker health response.");
          const hashResponse = await fetch(`${base}/hash`, { method: "POST", headers });
          const hashResult = await hashResponse.json();
          if (!hashResponse.ok || typeof hashResult.phc !== "string" || !hashResult.memoryGrowthObserved) {
            throw new Error(`Cloudflare Workers Argon2id hash test failed: HTTP ${hashResponse.status}`);
          }
          const verify = async password => {
            const response = await fetch(`${base}/verify`, {
              method: "POST",
              headers: { ...headers, "content-type": "application/json" },
              body: JSON.stringify({ password, phc: hashResult.phc })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(`Cloudflare Workers verify failed: HTTP ${response.status}`);
            return result;
          };
          const valid = await verify("isolated Cloudflare Workers Argon2id runtime test");
          const invalid = await verify("incorrect test password");
          const hashSamples = [hashResult];
          const verifySamples = [valid];
          for (let i = 0; i < 3; i += 1) {
            const response = await fetch(`${base}/hash`, { method: "POST", headers });
            const sample = await response.json();
            if (!response.ok || typeof sample.phc !== "string") throw new Error(`Sequential hash benchmark failed at sample ${i + 1}`);
            hashSamples.push(sample);
            const checked = await verify("isolated Cloudflare Workers Argon2id runtime test");
            if (checked.valid !== true) throw new Error(`Sequential verify benchmark failed at sample ${i + 1}`);
            verifySamples.push(checked);
          }
          const concurrentStart = performance.now();
          const concurrent = await Promise.all([
            fetch(`${base}/hash`, { method: "POST", headers }),
            fetch(`${base}/hash`, { method: "POST", headers })
          ]);
          const concurrentBodies = await Promise.all(concurrent.map(response => response.json()));
          const concurrentWallMs = Number((performance.now() - concurrentStart).toFixed(3));
          if (concurrent.some(response => !response.ok) || concurrentBodies.some(body => typeof body.phc !== "string")) {
            throw new Error("Concurrent hash benchmark failed.");
          }
          const result = {
            hashWallMsSamples: hashSamples.map(sample => sample.hashMs),
            verifyWallMsSamples: verifySamples.map(sample => sample.verifyMs),
            concurrentHashRequests: concurrent.length,
            concurrentHashBatchWallMs: concurrentWallMs,
            memoryPagesBefore: hashResult.memoryPagesBefore,
            memoryPagesAfterFirstHash: hashResult.memoryPagesAfter,
            memoryPagesAfterSequentialAndConcurrent: concurrentBodies.at(-1).memoryPagesAfter,
            memoryGrowthObserved: hashResult.memoryGrowthObserved,
            correctPasswordAccepted: valid.valid,
            wrongPasswordRejected: invalid.valid === false,
            timingNote: "performance.now() wall-clock duration, not Cloudflare CPU time"
          };
          console.log(JSON.stringify(result, null, 2));
          if (valid.valid !== true || invalid.valid !== false) throw new Error("Cloudflare Workers Argon2id PHC verification test failed.");
          NODE
          echo 'Waiting briefly for Workers invocation telemetry ingestion before querying the API.'
          sleep 20
          jq -n --arg worker "$WORKER" '{datasets:["cloudflare-workers"],filters:[{key:"$workers.scriptName",operation:"eq",type:"string",value:$worker}]}' > /tmp/argon2id-telemetry-keys-request.json
          KEYS_CODE="$(curl --silent --show-error --output /tmp/argon2id-telemetry-keys.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/argon2id-telemetry-keys-request.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/keys")"
          if [[ "$KEYS_CODE" == '200' ]] && jq -e '.success == true' /tmp/argon2id-telemetry-keys.json >/dev/null; then
            echo 'Cloudflare telemetry key discovery succeeded.'
            jq -r '.result[]?.key' /tmp/argon2id-telemetry-keys.json | grep -Ei 'cpuTimeMs|wallTimeMs|metadata.service' || true
            CPU_KEY="$(jq -r '.result[]? | select(.key | test("cpuTimeMs"; "i")) | .key' /tmp/argon2id-telemetry-keys.json | head -n 1)"
            WALL_KEY="$(jq -r '.result[]? | select(.key | test("wallTimeMs"; "i")) | .key' /tmp/argon2id-telemetry-keys.json | head -n 1)"
            if [[ -n "$CPU_KEY" && -n "$WALL_KEY" ]]; then
              QUERY_BODY="$(jq -n --arg worker "$WORKER" --argjson from "$RUNTIME_START_MS" --argjson to "$(date +%s%3N)" '{queryId:"argon2id-runtime-telemetry",timeframe:{from:$from,to:$to},parameters:{datasets:["cloudflare-workers"],filterCombination:"and",filters:[{key:"$workers.scriptName",operation:"eq",type:"string",value:$worker}],view:"invocations"},limit:100}')"
              QUERY_CODE="$(curl --silent --show-error --output /tmp/argon2id-telemetry-query.json --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --header 'Content-Type: application/json' \
                --data "$QUERY_BODY" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query")"
              if [[ "$QUERY_CODE" == '200' ]] && jq -e '.success == true' /tmp/argon2id-telemetry-query.json >/dev/null; then
                echo 'Cloudflare invocation telemetry query succeeded. CPU and wall-time samples follow; no JavaScript timers are used for these values.'
                jq -c '{success,errors,messages,run_status:.result.run.status,result_keys:(.result|keys),invocation_groups:((.result.invocations // {})|to_entries|map({request_id:.key,events:[.value[]|{trigger,timestamp,cpuTimeMs:.["$workers"].cpuTimeMs,wallTimeMs:.["$workers"].wallTimeMs,scriptName:.["$workers"].scriptName}]}))}' /tmp/argon2id-telemetry-query.json
                EVENT_COUNT="$(jq '[(.result.invocations // {}) | to_entries[] | .value[]] | length' /tmp/argon2id-telemetry-query.json)
                echo "Invocation event count returned by Cloudflare: $EVENT_COUNT"
              else
                echo "Cloudflare telemetry query did not return data (HTTP $QUERY_CODE); response is retained only in this ephemeral runner."
                jq -c '{success,errors,messages}' /tmp/argon2id-telemetry-query.json || true
              fi
            else
              echo 'Telemetry key discovery did not expose both CPU and wall-time fields; refusing to guess field names.'
            fi
          elif [[ "$KEYS_CODE" == '401' || "$KEYS_CODE" == '403' ]]; then
            echo "Cloudflare telemetry API access unavailable (HTTP $KEYS_CODE). Existing token lacks required Observability permission or is unauthorized; no permissions were changed."
          else
            echo "Cloudflare telemetry key discovery unavailable (HTTP $KEYS_CODE)."
            jq -c '{success,errors,messages}' /tmp/argon2id-telemetry-keys.json || true
          fi
          echo 'Telemetry query phase complete; proceeding to automatic Worker cleanup.'
          if [[ "$ARGON2ID_INJECT_FAILURE_AFTER_RUNTIME" == '1' ]]; then
            echo 'Injecting controlled failure after successful runtime checks to exercise EXIT cleanup.'
            exit 73
          fi
          unset ARGON2ID_TEST_TOKEN TOKEN
