name: Configure Cloudflare Preview admin secrets

on:
  workflow_dispatch:
  push:
    branches:
      - current-focus-development
    paths:
      - .github/workflows/configure-preview-secrets.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-admin-secrets
  cancel-in-progress: false

jobs:
  configure-preview-admin-secrets:
    # This workflow must never run from main or configure Production.
    if: github.ref == 'refs/heads/current-focus-development'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Preview-only credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          PREVIEW_SESSION_SECRET: ${{ secrets.PREVIEW_SESSION_SECRET || secrets.SESSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing CLOUDFLARE_API_TOKEN GitHub Actions secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID GitHub Actions secret}"
          : "${PREVIEW_ADMIN_EMAIL:?Missing PREVIEW_ADMIN_EMAIL or ADMIN_EMAIL GitHub Actions secret}"
          : "${PREVIEW_ADMIN_PASSWORD:?Missing PREVIEW_ADMIN_PASSWORD or ADMIN_PASSWORD GitHub Actions secret}"
          : "${PREVIEW_SESSION_SECRET:?Missing PREVIEW_SESSION_SECRET or SESSION_SECRET GitHub Actions secret}"
          if [ "${#PREVIEW_ADMIN_PASSWORD}" -lt 12 ]; then
            echo "Preview Admin password must be at least 12 characters."
            exit 1
          fi
          if [ "${#PREVIEW_SESSION_SECRET}" -lt 32 ]; then
            echo "Preview session secret must be at least 32 characters."
            exit 1
          fi
          echo "Required Preview Admin configuration is present; values are not displayed."

      - name: Configure Preview Base Admin secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          PREVIEW_SESSION_SECRET: ${{ secrets.PREVIEW_SESSION_SECRET || secrets.SESSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PREVIEW_ADMIN_EMAIL" | npx --yes wrangler@4.160.1 preview base-config secret put ADMIN_EMAIL
          printf '%s' "$PREVIEW_ADMIN_PASSWORD" | npx --yes wrangler@4.160.1 preview base-config secret put ADMIN_PASSWORD
          printf '%s' "$PREVIEW_SESSION_SECRET" | npx --yes wrangler@4.160.1 preview base-config secret put SESSION_SECRET

      - name: Configure the existing development Preview Admin secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          PREVIEW_SESSION_SECRET: ${{ secrets.PREVIEW_SESSION_SECRET || secrets.SESSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PREVIEW_ADMIN_EMAIL" | npx --yes wrangler@4.160.1 preview secret put ADMIN_EMAIL --name current-focus-development
          printf '%s' "$PREVIEW_ADMIN_PASSWORD" | npx --yes wrangler@4.160.1 preview secret put ADMIN_PASSWORD --name current-focus-development
          printf '%s' "$PREVIEW_SESSION_SECRET" | npx --yes wrangler@4.160.1 preview secret put SESSION_SECRET --name current-focus-development
          echo "Preview Admin secrets configured. Secret values were not printed."
