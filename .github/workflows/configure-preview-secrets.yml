name: Configure Cloudflare Preview runtime secrets

on:
  workflow_dispatch:
  push:
    branches:
      - current-focus-development
    paths:
      - .github/workflows/configure-preview-secrets.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-secrets
  cancel-in-progress: false

jobs:
  configure-preview-secrets:
    # This workflow must never run from main or configure Production.
    if: github.ref == 'refs/heads/current-focus-development'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure shared Preview Base secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          PREVIEW_SESSION_SECRET: ${{ secrets.PREVIEW_SESSION_SECRET || secrets.SESSION_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN in GitHub Actions secrets}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets}"
          : "${PREVIEW_ADMIN_EMAIL:?Add PREVIEW_ADMIN_EMAIL in GitHub Actions secrets}"
          : "${PREVIEW_ADMIN_PASSWORD:?Add PREVIEW_ADMIN_PASSWORD in GitHub Actions secrets}"
          : "${PREVIEW_SESSION_SECRET:?Add PREVIEW_SESSION_SECRET in GitHub Actions secrets}"
          : "${CLOUDINARY_CLOUD_NAME:?Add CLOUDINARY_CLOUD_NAME in GitHub Actions secrets}"
          : "${CLOUDINARY_API_KEY:?Add CLOUDINARY_API_KEY in GitHub Actions secrets}"
          : "${CLOUDINARY_API_SECRET:?Add CLOUDINARY_API_SECRET in GitHub Actions secrets}"

          printf '%s' "$PREVIEW_ADMIN_EMAIL" | npx --yes wrangler@4.160.1 preview base-config secret put ADMIN_EMAIL
          printf '%s' "$PREVIEW_ADMIN_PASSWORD" | npx --yes wrangler@4.160.1 preview base-config secret put ADMIN_PASSWORD
          printf '%s' "$PREVIEW_SESSION_SECRET" | npx --yes wrangler@4.160.1 preview base-config secret put SESSION_SECRET
          printf '%s' "$CLOUDINARY_CLOUD_NAME" | npx --yes wrangler@4.160.1 preview base-config secret put CLOUDINARY_CLOUD_NAME
          printf '%s' "$CLOUDINARY_API_KEY" | npx --yes wrangler@4.160.1 preview base-config secret put CLOUDINARY_API_KEY
          printf '%s' "$CLOUDINARY_API_SECRET" | npx --yes wrangler@4.160.1 preview base-config secret put CLOUDINARY_API_SECRET

      - name: Grant and verify Cloudinary Contributor access for Preview
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_ADMIN_API_KEY: ${{ secrets.CLOUDINARY_ADMIN_API_KEY }}
          CLOUDINARY_ADMIN_API_SECRET: ${{ secrets.CLOUDINARY_ADMIN_API_SECRET }}
          CLOUDINARY_PREVIEW_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Buffer } from "node:buffer";
          const names = ["CLOUDINARY_CLOUD_NAME", "CLOUDINARY_ADMIN_API_KEY", "CLOUDINARY_ADMIN_API_SECRET", "CLOUDINARY_PREVIEW_API_KEY"];
          for (const name of names) if (!process.env[name]) throw new Error("Missing GitHub Actions secret: " + name);
          const cloud = process.env.CLOUDINARY_CLOUD_NAME;
          const auth = "Basic " + Buffer.from(process.env.CLOUDINARY_ADMIN_API_KEY + ":" + process.env.CLOUDINARY_ADMIN_API_SECRET).toString("base64");
          const base = "https://api.cloudinary.com/v1_1/" + encodeURIComponent(cloud);
          async function call(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: { Authorization: auth, ...(options.body ? { "Content-Type": "application/json" } : {}) }
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(body?.error?.message || "Cloudinary Admin API returned HTTP " + response.status);
            return body;
          }
          const folderPath = "sohel-consulting";
          let folders = await call("/folders?max_results=500");
          let folder = (folders.folders || []).find(item => item.path === folderPath);
          if (!folder) {
            await call("/folders/" + encodeURIComponent(folderPath), { method: "POST" });
            folders = await call("/folders?max_results=500");
            folder = (folders.folders || []).find(item => item.path === folderPath);
          }
          if (!folder?.external_id) throw new Error("Could not resolve Cloudinary folder external_id for " + folderPath);
          const assignmentPath = "/folder_operations/invite/" + encodeURIComponent(folder.external_id);
          await call(assignmentPath, {
            method: "POST",
            body: JSON.stringify({
              principal: { id: process.env.CLOUDINARY_PREVIEW_API_KEY, type: "apiKey" },
              operation: "add",
              roles: ["cld::role::folder::contributor"]
            })
          });
          const access = await call(assignmentPath);
          const verified = (access.shared_with || []).some(entry =>
            entry.type === "apiKey" &&
            entry.id === process.env.CLOUDINARY_PREVIEW_API_KEY &&
            (entry.roles || []).some(role => role.id === "cld::role::folder::contributor" || role.name === "Contributor")
          );
          if (!verified) throw new Error("Cloudinary did not return the expected Contributor assignment for the Preview API key.");
          console.log("Verified Contributor folder access for the Preview API key.");
          NODE

      - name: Apply the same secrets to the existing development Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
          PREVIEW_SESSION_SECRET: ${{ secrets.PREVIEW_SESSION_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PREVIEW_ADMIN_EMAIL" | npx --yes wrangler@4.160.1 preview secret put ADMIN_EMAIL --name current-focus-development
          printf '%s' "$PREVIEW_ADMIN_PASSWORD" | npx --yes wrangler@4.160.1 preview secret put ADMIN_PASSWORD --name current-focus-development
          printf '%s' "$PREVIEW_SESSION_SECRET" | npx --yes wrangler@4.160.1 preview secret put SESSION_SECRET --name current-focus-development
          printf '%s' "$CLOUDINARY_CLOUD_NAME" | npx --yes wrangler@4.160.1 preview secret put CLOUDINARY_CLOUD_NAME --name current-focus-development
          printf '%s' "$CLOUDINARY_API_KEY" | npx --yes wrangler@4.160.1 preview secret put CLOUDINARY_API_KEY --name current-focus-development
          printf '%s' "$CLOUDINARY_API_SECRET" | npx --yes wrangler@4.160.1 preview secret put CLOUDINARY_API_SECRET --name current-focus-development
