name: Configure Cloudflare Preview admin secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-admin-secrets
  cancel-in-progress: false

jobs:
  configure-preview-admin-secrets:
    if: github.ref == 'refs/heads/current-focus-development'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Preview-only credentials are available
        env:
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          PREVIEW_SESSION_SECRET: ${{ secrets.PREVIEW_SESSION_SECRET || secrets.SESSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_WORKERS_API_TOKEN:?Missing CLOUDFLARE_WORKERS_API_TOKEN GitHub Actions secret (use the dedicated Workers deployment token)}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing CLOUDFLARE_ACCOUNT_ID}"
          : "${PREVIEW_ADMIN_EMAIL:?Missing Preview Admin email secret}"
          : "${PREVIEW_ADMIN_PASSWORD:?Missing Preview Admin password secret}"
          : "${PREVIEW_SESSION_SECRET:?Missing Preview session secret}"
          if [ "${#PREVIEW_ADMIN_PASSWORD}" -lt 12 ]; then echo "Preview Admin password must be at least 12 characters."; exit 1; fi
          if [ "${#PREVIEW_SESSION_SECRET}" -lt 32 ]; then echo "Preview session secret must be at least 32 characters."; exit 1; fi
          echo "Required Preview credentials are present; values are not displayed."

      - name: Configure the existing development Preview Admin secrets
        env:
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL || secrets.ADMIN_EMAIL }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
          PREVIEW_SESSION_SECRET: ${{ secrets.PREVIEW_SESSION_SECRET || secrets.SESSION_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PREVIEW_ADMIN_EMAIL" | npx --yes wrangler@4.160.1 preview secret put ADMIN_EMAIL --name current-focus-development
          printf '%s' "$PREVIEW_ADMIN_PASSWORD" | npx --yes wrangler@4.160.1 preview secret put ADMIN_PASSWORD --name current-focus-development
          printf '%s' "$PREVIEW_SESSION_SECRET" | npx --yes wrangler@4.160.1 preview secret put SESSION_SECRET --name current-focus-development
          echo "Development Preview Admin secrets configured. Values were not printed."
