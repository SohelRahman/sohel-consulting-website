name: Apply Cloudflare Preview D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-preview:
    # Hard guard: this workflow must only run from the development branch.
    if: github.ref == 'refs/heads/current-focus-development'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve and verify the dedicated Preview D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const config = readFileSync("wrangler.toml", "utf8");
          const previewSection = config.split("[previews.d1_databases]")[1] || "";
          const previewLine = previewSection.split(String.fromCharCode(10)).find(line => line.trim().startsWith("database_id"));
          const previewId = previewLine?.split("=")[1]?.trim().slice(1, -1);
          const expectedPreviewId = "e0317397-77cb-4f36-9d19-2594ff75b0c2";
          const productionId = "3a4f765a-46c2-4040-9753-36e9483893a4";
          if (previewId !== expectedPreviewId || previewId === productionId) {
            throw new Error("Preview D1 target verification failed; refusing to run migrations.");
          }

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!accountId || !token) throw new Error("Cloudflare API credentials are not configured.");
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const payload = await response.json();
          if (!response.ok || payload.success !== true) {
            throw new Error("Unable to verify Preview D1 database through Cloudflare API.");
          }
          const database = (payload.result || []).find(item => item.uuid === expectedPreviewId || item.id === expectedPreviewId);
          if (!database?.name) throw new Error("The configured Preview D1 database ID was not found in this Cloudflare account.");
          writeFileSync("wrangler.preview-migrations.jsonc", JSON.stringify({
            name: "consulting-preview-migrations",
            d1_databases: [{
              binding: "PREVIEW_DB",
              database_name: database.name,
              database_id: expectedPreviewId,
              migrations_dir: "migrations"
            }]
          }, null, 2) + String.fromCharCode(10));
          console.log("Verified dedicated Preview D1 database:", expectedPreviewId);
          NODE

      - name: Check pending Preview migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc

      - name: Apply pending migrations to Preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc

      - name: Verify Preview migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 d1 migrations list PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
