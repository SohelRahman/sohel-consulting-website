name: Apply Cloudflare Preview D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-d1-migrations
  cancel-in-progress: false

jobs:
  migrate-preview:
    # Hard guard: this workflow must only run from the development branch.
    if: github.ref == 'refs/heads/current-focus-development'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the configured Preview D1 target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = readFileSync("wrangler.toml", "utf8");
          const previewSection = config.split("[previews.d1_databases]")[1] || "";
          const previewId = previewSection.match(/database_id\\s*=\\s*"([^"]+)"/)?.[1];
          const expectedPreviewId = "e0317397-77cb-4f36-9d19-2594ff75b0c2";
          const productionId = "3a4f765a-46c2-4040-9753-36e9483893a4";
          if (previewId !== expectedPreviewId || previewId === productionId) {
            throw new Error("Preview D1 target verification failed; refusing to run migrations.");
          }
          console.log("Verified dedicated Preview D1 target:", previewId);
          NODE

      - name: Check pending Preview migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 d1 migrations list DB --preview --config wrangler.toml

      - name: Apply pending migrations to Preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 d1 migrations apply DB --preview --config wrangler.toml

      - name: Verify Preview migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 d1 migrations list DB --preview --config wrangler.toml
