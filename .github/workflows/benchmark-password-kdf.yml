name: Isolated Preview password KDF benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - current-focus-development

permissions:
  contents: read

concurrency:
  group: isolated-password-kdf-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kdf-benchmark]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: current-focus-development
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.5'
      - name: Install pinned benchmark dependency
        working-directory: benchmarks/password-kdf
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy isolated benchmark Worker, test and remove it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing Cloudflare Workers API token secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing Cloudflare account ID secret}"
          WORKER='sohel-password-kdf-benchmark'
          TOKEN="$(node --input-type=module -e 'import { randomBytes } from "node:crypto"; process.stdout.write(randomBytes(32).toString("base64url"))')"
          DEPLOYED=0
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -n "${TOKEN:-}" ]]; then unset TOKEN; fi
            if [[ "$DEPLOYED" == '1' ]]; then
              if npx --yes wrangler@4.160.1 delete --name "$WORKER" --force --config benchmarks/password-kdf/wrangler.toml; then
                echo 'Temporary benchmark Worker deletion confirmed by Wrangler.'
              else
                echo '::error::Temporary benchmark Worker deletion failed; manual cleanup is required.'
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          npx --yes wrangler@4.160.1 deploy --config benchmarks/password-kdf/wrangler.toml 2>&1 | tee /tmp/kdf-deploy.log
          DEPLOYED=1
          printf '%s' "$TOKEN" | npx --yes wrangler@4.160.1 secret put BENCHMARK_TOKEN --name "$WORKER" --config benchmarks/password-kdf/wrangler.toml
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/kdf-deploy.log | tail -n 1)"
          : "${URL:?Could not identify isolated benchmark Worker URL}"
          export KDF_BENCHMARK_URL="$URL" KDF_BENCHMARK_TOKEN="$TOKEN"
          node --input-type=module <<'NODE'
          const url = `${process.env.KDF_BENCHMARK_URL}/benchmark`;
          let response;
          let body = '';
          for (let attempt = 0; attempt < 8; attempt++) {
            response = await fetch(url, { method: 'POST', headers: { authorization: `Bearer ${process.env.KDF_BENCHMARK_TOKEN}` } });
            body = await response.text();
            if (response.ok || response.status !== 401) break;
            await new Promise(resolve => setTimeout(resolve, 1500));
          }
          if (!response.ok) throw new Error(`Benchmark Worker returned HTTP ${response.status}: ${body.slice(0, 500)}`);
          const result = JSON.parse(body);
          console.log(JSON.stringify(result, null, 2));
          if (!result.sequential?.valid || result.concurrent?.some(item => !item.valid)) throw new Error('Argon2id verification check failed.');
          NODE
          unset TOKEN KDF_BENCHMARK_TOKEN
