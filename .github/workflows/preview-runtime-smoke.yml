name: Preview runtime smoke tests

on:
  push:
    branches:
      - current-focus-development

permissions:
  contents: read

concurrency:
  group: preview-runtime-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/current-focus-development' && contains(github.event.head_commit.message, '[preview-smoke]')
    runs-on: ubuntu-latest
    steps:
      - name: Check public Preview pages and security boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://current-focus-development.sohelrahman118.workers.dev"

          check_status() {
            local path="$1" expected="$2" actual
            actual="$(curl --silent --show-error --output /tmp/preview-body --write-out '%{http_code}' "$BASE$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "FAIL $path expected HTTP $expected, received $actual"
              head -c 500 /tmp/preview-body || true
              exit 1
            fi
            echo "PASS $path HTTP $actual"
          }

          check_status "/" "200"
          grep -Eqi '<!doctype html|<html' /tmp/preview-body
          check_status "/admin.html" "200"
          grep -Eqi '<!doctype html|<html' /tmp/preview-body
          check_status "/bn/index.html" "200"
          grep -Eqi '<!doctype html|<html' /tmp/preview-body
          check_status "/quote-response.html" "200"
          grep -Eqi '<!doctype html|<html' /tmp/preview-body

          check_status "/api/admin/summary" "401"
          check_status "/src/worker.js" "404"
          check_status "/migrations/0019_admin_mfa.sql" "404"
          check_status "/wrangler.toml" "404"

          curl --silent --show-error --dump-header /tmp/quote-headers --output /dev/null "$BASE/quote-response.html"
          echo "Observed quotation-response headers:"
          tr -d '\r' < /tmp/quote-headers | grep -Ei '^(HTTP/|cache-control:|referrer-policy:|x-robots-tag:)' || true
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const raw = readFileSync("/tmp/quote-headers", "utf8").replaceAll("\r", "");
          const blocks = raw.split("\n\n").filter(Boolean);
          const headers = new Map();
          for (const line of (blocks.at(-1) || "").split("\n").slice(1)) {
            const i = line.indexOf(":");
            if (i > 0) headers.set(line.slice(0, i).trim().toLowerCase(), line.slice(i + 1).trim().toLowerCase());
          }
          const checks = [
            ["cache-control", value => value.includes("no-store")],
            ["referrer-policy", value => value.includes("no-referrer")],
            ["x-robots-tag", value => value.includes("noindex") && value.includes("nofollow") && value.includes("noarchive")]
          ];
          const missing = checks.filter(([name, test]) => !test(headers.get(name) || ""));
          if (missing.length) {
            console.error("Missing or incorrect quotation-response privacy headers:", missing.map(x => x[0]).join(", "));
            process.exit(1);
          }
          console.log("PASS quotation response privacy headers");
          NODE

          echo "Preview HTTP smoke tests passed."
