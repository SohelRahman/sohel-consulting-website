name: Diagnose Preview Admin login database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-admin-login-diagnostics
  cancel-in-progress: false

jobs:
  diagnose-preview:
    if: github.ref == 'refs/heads/current-focus-development'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and prepare the Preview D1 target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const config = readFileSync("wrangler.toml", "utf8");
          const previewSection = config.split("[[previews.d1_databases]]")[1] || "";
          const previewLine = previewSection.split(String.fromCharCode(10)).find(line => line.trim().startsWith("database_id"));
          const previewId = previewLine?.split("=")[1]?.trim().slice(1, -1);
          const expected = "e0317397-77cb-4f36-9d19-2594ff75b0c2";
          const production = "3a4f765a-46c2-4040-9753-36e9483893a4";
          if (previewId !== expected || previewId === production) throw new Error("Preview database ID guard failed.");
          const token = (process.env.CLOUDFLARE_API_TOKEN || "").replace(/\\s+/g, "");
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !accountId) throw new Error("Cloudflare credentials are not configured.");
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${expected}`, {
            headers: { Authorization: `Bearer ${token}`, Accept: "application/json" }
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.success !== true || !payload.result?.name) {
            throw new Error(`Preview D1 lookup failed with HTTP ${response.status}. Check D1 Read access.`);
          }
          if ((payload.result.uuid || payload.result.id) !== expected) throw new Error("Cloudflare database identity mismatch.");
          writeFileSync("wrangler.preview-diagnostics.jsonc", JSON.stringify({
            name: "consulting-preview-diagnostics",
            d1_databases: [{
              binding: "PREVIEW_DB",
              database_name: payload.result.name,
              database_id: expected
            }]
          }, null, 2) + String.fromCharCode(10));
          console.log("Preview D1 target verified. Production database is excluded.");
          NODE

      - name: Confirm Preview D1 migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 d1 migrations list PREVIEW_DB --remote --config wrangler.preview-diagnostics.jsonc

      - name: Check required Preview tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.160.1 d1 execute PREVIEW_DB --remote --config wrangler.preview-diagnostics.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('rate_limits','admin_users','audit_logs') ORDER BY name;"

      - name: Check Preview administrator account count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.160.1 d1 execute PREVIEW_DB --remote --config wrangler.preview-diagnostics.jsonc --command "SELECT COUNT(*) AS admin_user_count FROM admin_users;"
