name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: node --input-type=module --check < src/worker.js
      - name: Check shared website JavaScript syntax
        run: node --check assets/site.js
      - name: Validate HTML, local links and inline scripts
        run: node scripts/validate-site.mjs
      - name: Check RBAC security contract
        run: node scripts/test-rbac-contract.mjs
      - name: Check CMS write atomicity contract
        run: node scripts/test-cms-atomicity.mjs
      - name: Check Page Builder write atomicity contract
        run: node scripts/test-page-builder-atomicity.mjs
      - name: Check bulk CMS initialization atomicity contract
        run: node scripts/test-cms-initialization-atomicity.mjs
      - name: Check bulk CMS initialization recovery paths
        run: node scripts/test-cms-initialization-recovery.mjs
      - name: Check CMS revision concurrency contract
        run: node scripts/test-cms-revision-contract.mjs
      - name: Check CMS revision SQL and transaction behavior in SQLite
        run: python3 scripts/test-cms-revision-sqlite.py
      - name: Password hashing compatibility tests
        run: node scripts/test-password-hash.mjs
      - name: Admin MFA cryptographic and source-contract tests
        run: node scripts/test-admin-mfa.mjs
      - name: Course pricing unit tests
        run: node scripts/test-course-pricing.mjs
      - name: Registration workflow contract tests
        run: node scripts/test-registration-workflow.mjs
      - name: Learner quotation response contract tests
        run: node scripts/test-quotation-response.mjs

  deploy:
    needs: validate
    # Production deployments are allowed only from the main branch.
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Wrangler deployment plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
