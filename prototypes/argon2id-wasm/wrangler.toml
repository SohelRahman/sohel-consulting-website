name = "sohel-argon2id-prototype-preview"
main = "worker.mjs"
compatibility_date = "2026-11-26"
workers_dev = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# Enable native Workers invocation logs for CPUTimeMs/WallTimeMs measurement.
# Workers Logs is included on Workers Free; no Logpush destination is configured.
[observability]
enabled = true
head_sampling_rate = 1.0

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1.0
