<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Page | Sohel Rahman</title><link rel="stylesheet" href="/assets/site.css"><style>
.builder-page{min-height:65vh}.builder-section{padding:clamp(36px,7vw,88px) 0}.builder-inner{width:min(1100px,calc(100% - 40px));margin:auto}.builder-section h1,.builder-section h2{margin:0 0 18px;line-height:1.15}.builder-section h1{font:800 clamp(36px,5vw,64px)/1.08 Manrope,sans-serif}.builder-section h2{font:700 clamp(27px,3.5vw,42px)/1.15 Manrope,sans-serif}.builder-section p{white-space:pre-line;color:inherit;line-height:1.8;max-width:760px}.builder-hero{text-align:center}.builder-hero .builder-inner{display:flex;flex-direction:column;align-items:center}.builder-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.builder-card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}.builder-card{background:#0c2037;border:1px solid #29435d;border-radius:7px;padding:22px}.builder-card h3{margin:0 0 10px}.builder-error{padding:60px 20px;text-align:center;color:#c4d1df}@media(max-width:700px){.builder-card-grid{grid-template-columns:1fr}}
</style></head><body>
<header class="site-header"><a class="brand" href="/index.html"><span class="brand-mark">SR</span><span>SOHEL RAHMAN<small>CONSULTING · TRAINING · PROFESSIONAL DEVELOPMENT</small></span></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav"><a href="/index.html">Home</a><a href="/services.html">Consulting</a><a href="/training.html">Training</a><a href="/register.html">Register</a><a href="/about.html">About</a><a href="/contact.html">Contact ↗</a></nav></header>
<main id="page-content" class="builder-page"><div class="builder-error">Loading page…</div></main>
<footer class="footer"><div class="wrap footer-inner"><a class="brand" href="/index.html"><span class="brand-mark">SR</span><span>SOHEL RAHMAN<small>CONSULTING · TRAINING · PROFESSIONAL DEVELOPMENT</small></span></a><span>© <span id="year"></span> Sohel Rahman</span><a href="mailto:sohelrahman118@gmail.com">sohelrahman118@gmail.com</a></div></footer>
<script src="/assets/site.js"></script><script>
const slug=new URLSearchParams(location.search).get('slug')||location.pathname.split('/').pop().replace(/\\.html$/,'');
const root=document.querySelector('#page-content');
const make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n;};
const safeUrl=value=>{try{const u=new URL(value,location.origin);return ['http:','https:'].includes(u.protocol)?u.href:'#';}catch{return '#';}};
function render(page){document.title=(page.seo_title||page.title)+' | Sohel Rahman';document.documentElement.lang=page.language||'en';if(page.seo_description){let m=document.querySelector('meta[name="description"]');if(!m){m=document.createElement('meta');m.name='description';document.head.append(m);}m.content=page.seo_description;}root.replaceChildren();for(const s of page.sections||[]){const section=make('section','builder-section');const layout=s.layout||{};section.style.backgroundColor=layout.backgroundColor||'transparent';section.style.color=layout.textColor||'';section.style.textAlign=layout.textAlign||'left';section.style.paddingTop=(layout.paddingTop||64)+'px';section.style.paddingBottom=(layout.paddingBottom||64)+'px';const inner=make('div','builder-inner');inner.style.maxWidth=(layout.maxWidth||'1100')+'px';if(s.type==='hero')section.classList.add('builder-hero');if(s.type==='hero'||s.type==='text'||s.type==='cta'){const h=make(s.type==='hero'?'h1':'h2','',s.heading||'');if(s.heading)inner.append(h);if(s.body)inner.append(make('p','',s.body));if(s.buttonText){const a=make('a','button primary',s.buttonText);a.href=safeUrl(s.buttonUrl||'/contact.html');inner.append(a);}}else if(s.type==='split'){const grid=make('div','');grid.style.display='grid';grid.style.gridTemplateColumns='repeat(auto-fit,minmax(240px,1fr))';grid.style.gap='32px';for(const item of [s.left,s.right]){const col=make('div','');if(item?.heading)col.append(make('h2','',item.heading));if(item?.body)col.append(make('p','',item.body));grid.append(col);}inner.append(grid);}else if(s.type==='cards'){if(s.heading)inner.append(make('h2','',s.heading));const grid=make('div','builder-card-grid');for(const item of (s.items||[])){const card=make('article','builder-card');card.append(make('h3','',item.heading||''));card.append(make('p','',item.body||''));if(item.buttonText){const a=make('a','text-link',item.buttonText);a.href=safeUrl(item.buttonUrl||'/contact.html');card.append(a);}grid.append(card);}inner.append(grid);}section.append(inner);root.append(section);}if(!root.children.length)root.append(make('div','builder-error','This page has no published sections yet.'));document.querySelector('#year').textContent=new Date().getFullYear();}
fetch('/api/pages/'+encodeURIComponent(slug)).then(r=>{if(!r.ok)throw new Error('Page not found');return r.json();}).then(d=>render(d.page)).catch(()=>{root.replaceChildren(make('div','builder-error','This page is unavailable.'));});
</script></body></html>
