<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Quotation response | Sohel Consulting</title><style>
:root{color-scheme:light;--ink:#172536;--muted:#5d6b7a;--line:#dce3ea;--brand:#174a73}*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(620px,calc(100% - 32px));margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(22px,5vw,38px);box-shadow:0 12px 36px #17253612}h1{font-size:1.65rem;line-height:1.25;margin:0 0 8px}p{color:var(--muted)}.field{padding:14px 0;border-bottom:1px solid var(--line)}.label{display:block;color:var(--muted);font-size:.88rem}.value{font-weight:650;overflow-wrap:anywhere}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button{border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer}.accept{background:var(--brand);color:#fff}.decline{background:#eef1f4;color:#263646}button:disabled{opacity:.55;cursor:not-allowed}#message{min-height:28px;margin-top:18px}#message.error{color:#a32626}#message.success{color:#17633d}.notice{font-size:.9rem}</style></head><body><main>
<h1 id="heading">Quotation response</h1><p id="intro">Review the quotation details, then choose whether to accept or decline.</p><div id="details" aria-live="polite"><p>Loading quotation…</p></div><div id="actions" class="actions" hidden><button class="accept" id="accept" type="button">Accept quotation</button><button class="decline" id="decline" type="button">Decline quotation</button></div><p id="message" role="status" aria-live="polite"></p><p class="notice" id="notice">This secure link can be used once and expires after seven days. Contact the administrator if you need help.</p></main>
<script>(()=>{const token=new URLSearchParams(location.hash.slice(1)).get('token')||new URLSearchParams(location.search).get('token')||'';history.replaceState(null,'',location.pathname);const details=document.getElementById('details'),actions=document.getElementById('actions'),message=document.getElementById('message');let language='en';const copy={en:{heading:'Quotation response',intro:'Review the quotation details, then choose whether to accept or decline.',course:'Course',reference:'Registration reference',amount:'Quoted amount',valid:'Valid until',accept:'Accept quotation',decline:'Decline quotation',notice:'This secure link can be used once and expires after seven days. Contact the administrator if you need help.',accepted:'You accepted this quotation. The registration is approved and payment is pending. Enrollment confirmation is handled separately.',declined:'You declined this quotation. The administrator has been notified.',failed:'Your response could not be recorded. This link may have expired or already been used.',description:'Description'},bn:{heading:'কোটেশনের উত্তর',intro:'কোটেশনের তথ্য পর্যালোচনা করে গ্রহণ অথবা প্রত্যাখ্যান নির্বাচন করুন।',course:'কোর্স',reference:'রেজিস্ট্রেশন রেফারেন্স',amount:'প্রস্তাবিত ফি',valid:'কার্যকর থাকবে',accept:'কোটেশন গ্রহণ করুন',decline:'কোটেশন প্রত্যাখ্যান করুন',notice:'এই নিরাপদ লিংকটি একবার ব্যবহার করা যাবে এবং সাত দিন পর মেয়াদ শেষ হবে। সহায়তার জন্য প্রশাসকের সঙ্গে যোগাযোগ করুন।',accepted:'আপনি কোটেশন গ্রহণ করেছেন। রেজিস্ট্রেশন অনুমোদিত হয়েছে এবং পেমেন্ট অপেক্ষমাণ। এনরোলমেন্ট নিশ্চিতকরণ আলাদাভাবে করা হবে।',declined:'আপনি কোটেশন প্রত্যাখ্যান করেছেন। প্রশাসককে জানানো হয়েছে।',failed:'আপনার উত্তর সংরক্ষণ করা যায়নি। লিংকটির মেয়াদ শেষ হয়েছে অথবা এটি আগে ব্যবহার করা হয়েছে।',description:'বিবরণ'}};const set=(id,v)=>document.getElementById(id).textContent=v;const fail=v=>{message.textContent=v;message.className='error';actions.hidden=true};const money=(n,c)=>new Intl.NumberFormat(language==='bn'?'bn-BD':'en-BD',{style:'currency',currency:c,maximumFractionDigits:2}).format(n/100);async function load(){if(!/^[A-Za-z0-9_-]{40,60}$/.test(token)){fail(copy.en.failed);return}try{const res=await fetch('/api/quotation-response',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,action:'details'})}),data=await res.json();if(!res.ok||!data.quotation)throw Error();const q=data.quotation;language=q.language==='bn'?'bn':'en';const t=copy[language];document.documentElement.lang=language;for(const [k,v] of Object.entries({heading:t.heading,intro:t.intro,notice:t.notice,accept:t.accept,decline:t.decline}))set(k,v);details.replaceChildren();for(const [label,value] of [[t.course,q.course_title],[t.reference,q.reference_code],[t.amount,money(q.amount_minor,q.currency)],[t.valid,q.valid_until||'—'],...(q.description?[[t.description,q.description]]:[])]){const box=document.createElement('div'),l=document.createElement('span'),v=document.createElement('div');box.className='field';l.className='label';v.className='value';l.textContent=label;v.textContent=value;box.append(l,v);details.append(box)}actions.hidden=false}catch{fail(copy.en.failed)}}async function respond(decision){const t=copy[language];document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const res=await fetch('/api/quotation-response',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,decision})}),data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||t.failed);actions.hidden=true;message.textContent=decision==='accepted'?t.accepted:t.declined;message.className='success'}catch(e){message.textContent=e.message||t.failed;message.className='error';document.querySelectorAll('button').forEach(b=>b.disabled=false)}}document.getElementById('accept').addEventListener('click',()=>respond('accepted'));document.getElementById('decline').addEventListener('click',()=>{if(confirm(language==='bn'?'আপনি কি এই কোটেশন প্রত্যাখ্যান করতে চান?':'Are you sure you want to decline this quotation?'))respond('declined')});load()})();</script></body></html>
